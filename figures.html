<!DOCTYPE html>
<html lang=en>
    
    <head>
        <meta charset="UTF-8">
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Money</title>



        <link rel="stylesheet" href="fonts.css">
        <link href="figures.css" rel="stylesheet">
    </head>

    <body>

        <div class="head">
            How much do you need?
        </div>

        <form id="figures-form" novalidate>
            <input class="needed" type="text" id="needed" name="needed" inputmode="decimal" placeholder="Enter amount (e.g. 500)" required>

            <div class="when">
                When do you need it?
            </div>

            <input class="whent" type="date" id="whent" name="whent" required>

            <p class="figures-error" id="figures-error" hidden></p>

            <button type="submit" class="cont">Continue</button>
        </form>

    <script src="js/money-app.js"></script>
    <script src="js/page-figures.js"></script>
    </body>

</html>
