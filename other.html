<!DOCTYPE html>
<html lang=en>
    
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="fonts.css">
        <link rel="stylesheet" href="other.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Money</title>

    </head>
 <body>

    <div class="help"><a href=advice.html>Need help?</a></div>

    <div class="top">
        <div class="time">
           Loading…
        </div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar-fill"></div></div>
        <div class="money">$0 / $0</div>
    </div>

    <div class="picture">

    </div>

    <div class="bottom">
        <div class="goal">
            Save $0 this month!
        </div>
        <form id="savings-form" novalidate>
            <textarea placeholder="Enter amount saved" class="add" id="add-amount" inputmode="decimal"></textarea>
            <p class="savings-error" id="savings-error" hidden></p>
            <button type="submit" class="add-btn">Add to savings</button>
        </form>
    </div>

    <script src="js/money-app.js"></script>
    <script src="js/page-other.js"></script>
    </body>
